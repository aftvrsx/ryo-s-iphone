<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RYO — private device</title><style>
*{box-sizing:border-box}body{margin:0;background:#08090c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100dvh;display:grid;place-items:center}button{font:inherit;cursor:pointer}.phone{width:min(390px,100vw);height:min(844px,100dvh);position:relative;overflow:hidden;border:7px solid #292b30;border-radius:48px;background:#15151b;box-shadow:0 30px 100px #000d}.wall{position:absolute;inset:0;background:linear-gradient(180deg,#0009 0%,#0002 45%,#000b 100%),url("photos/ryo-wallpaper.jpeg") center center/cover no-repeat}.wall:after{content:'';position:absolute;top:47%;left:50%;transform:translate(-50%,-50%) rotate(-90deg);font-size:130px;font-weight:900;letter-spacing:-12px;color:#ffffff13}.island{position:absolute;z-index:20;top:11px;left:50%;transform:translateX(-50%);width:116px;height:30px;background:#050506;border-radius:24px}.status{position:absolute;top:20px;left:27px;right:26px;z-index:19;display:flex;justify-content:space-between;font-size:13px;font-weight:650;pointer-events:none}.screen{position:absolute;inset:0;display:none}.screen.active{display:block}.lock{text-align:center;padding-top:110px;cursor:pointer}.lockdate{font-size:18px}.locktime{font-size:78px;font-weight:200;letter-spacing:-5px}.lockquote{position:absolute;top:52%;width:100%;font-size:13px;letter-spacing:5px;color:#ddd9}.unlock{position:absolute;bottom:74px;left:0;right:0;font-size:14px;animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.4}}.home{padding:93px 19px 120px}.widget{border:1px solid #ffffff24;background:#14131a80;backdrop-filter:blur(20px);padding:18px;border-radius:23px;margin-bottom:25px;cursor:pointer}.eyebrow{font-size:10px;letter-spacing:2px;color:#b9aeb9}.widget h2{margin:9px 0 4px;font-size:20px}.widget p{margin:0;color:#d0c6d0;font-size:12px}.appgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 7px}.app{text-align:center;font-size:11px;cursor:pointer}.ico{width:61px;height:61px;border-radius:16px;display:grid;place-items:center;font-size:29px;margin:0 auto 6px;box-shadow:0 5px 14px #0003}.dock{position:absolute;bottom:31px;left:16px;right:16px;display:flex;justify-content:space-around;padding:12px 5px 7px;background:#ffffff2b;backdrop-filter:blur(24px);border-radius:26px}.dock .ico{margin:0}.appscreen{background:#111115;padding:65px 18px 48px;overflow:auto}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.back{background:none;border:0;color:#aeb8ff;padding:0}.appscreen h1{font-size:32px;margin:0 0 16px;letter-spacing:-1px}.muted{color:#a5a4af;font-size:12px}.listitem{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #303036;cursor:pointer}.avatar{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#3b3642;font-weight:600}.listitem b{font-size:15px}.listitem p{font-size:12px;color:#aaa;margin:5px 0 0}.right{margin-left:auto;color:#999;font-size:11px}.bubble{background:#303038;padding:12px 15px;border-radius:18px;margin:13px 0;max-width:86%;line-height:1.5;font-size:14px;width:max-content}.bubble.me{background:#3761b8;margin-left:auto}.threadhead{text-align:center;margin:22px 0}.threadhead .avatar{margin:auto auto 8px}.note{background:#232329;border-radius:13px;padding:16px;margin:12px 0;line-height:1.6;cursor:pointer}.note h3{margin:0 0 7px;font-size:17px}.note p{margin:0;color:#bbb;font-size:13px}.photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.photo{aspect-ratio:1;background:linear-gradient(130deg,#574755,#191a21);display:grid;place-items:center;font-size:39px;cursor:pointer;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.detailphoto{font-size:115px;text-align:center;padding:85px 0;background:linear-gradient(140deg,#554657,#1c1a24);border-radius:10px}.song{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #282830;cursor:pointer}.cover{width:52px;height:52px;border-radius:7px;background:linear-gradient(135deg,#9d7f8f,#302b39);display:grid;place-items:center;font-size:22px}.song p{margin:4px 0 0;color:#999;font-size:12px}.pill{border:1px solid #666;border-radius:25px;padding:9px 15px;background:#282830;color:#fff}.homebar{position:absolute;bottom:11px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:6px;background:#fff;z-index:30;cursor:pointer}.secret{font-size:12px;color:#bdb4bd;line-height:1.7}.calday{background:#2b2530;padding:19px;border-radius:18px;margin:12px 0}.calday strong{font-size:26px}.fakecamera{height:420px;background:radial-gradient(circle at center,#453a47,#0d0e12);border-radius:15px;display:grid;place-items:center;font-size:72px}.shutter{width:65px;height:65px;border:5px solid #fff;background:#fff;border-radius:50%;display:block;margin:24px auto}.toast{position:absolute;top:55px;left:30px;right:30px;background:#38323de8;padding:13px;border-radius:14px;z-index:40;text-align:center;font-size:13px;display:none}@media(min-width:500px){body{padding:20px}}@media(max-width:390px){.phone{border-width:0;border-radius:0}.ico{width:58px;height:58px}}
</style></head><body><main class="phone"><div class="wall"></div><div class="island"></div><div class="status"><span id="statusTime">9:41</span><span>●●●  ▰</span></div><div class="toast" id="toast"></div><section class="screen lock active" id="lock" onclick="show('home')"><div class="lockdate" id="date"></div><div class="locktime" id="clock"></div><div class="lockquote">NO CALLER ID.</div><div class="unlock">⌃<br>swipe up to unlock<br><small>(or tap anywhere)</small></div></section><section class="screen home" id="home"><div class="widget" onclick="openApp('Music')"><div class="eyebrow">NOW PLAYING · RYO'S ROTATION</div><h2>songs i won’t skip</h2><p>Puma Blue · The Marías · Frank Ocean</p></div><div class="appgrid" id="apps"></div><div class="dock" id="dock"></div></section><section class="screen appscreen" id="appscreen"><div class="topbar"><button class="back" onclick="show('home')">‹ Home</button><span class="muted">RYO'S IPHONE</span></div><div id="content"></div></section><div class="homebar" onclick="show('home')"></div></main><script>
const apps=[['Messages','💬','#35b759'],['Photos','🌄','#e6e4e7'],['Notes','📝','#e0b749'],['Music','♫','#dc4963'],['Contacts','👤','#777680'],['Camera','📷','#686875'],['Calendar','📅','#f4f3f5'],['Settings','⚙','#727884']];const threads={Mateo:[['them','omurice again?'],['me','you say that like i ever said no'],['them','you made me carry all your bags last time'],['me','and you looked great doing it.']],Eira:[['them','you actually showed up for your cousin'],['me','i always ragebait my family but i adore them'],['them','and you have a flight tomorrow?'],['me','new york. don’t miss me too much.']],Cherry:[['them','family dinner. do not disappear.'],['me','i’m literally the life of this family'],['them','you are the problem in this family'],['me','both can be true']],Aki:[['them','we’re just friends, right?'],['me','obviously'],['them','right.'],['me','why are you saying it like that']],Vex:[['them','sometimes i just wanna disappear from everyone’s lives'],['me','you can take your space without convincing yourself nobody wants you around']],Kin:[['them','you awake?'],['me','studio. where else would i be?']]};const notes=[['things i probably won’t say out loud','i can make a song out of almost anything. except the things i actually need to say.'],['02:17 AM — studio','another night spent adjusting a mix instead of fixing my sleeping schedule. sounds about right.'],['things worth remembering','vanilla ice cream. matcha. sunsets. family. people who keep their word.'],['books on my shelf','No Longer Human — Osamu Dazai. More sci-fi and dystopian fiction, please.'],['october 31','Till Death Do Us Party. Dress like you died hot. Keep the party alive. #Ryolloween26'],['unsent','some things are easier to put in a song than in a message.']];const photos=[["photos/IMG_5426.jpeg", "mirror archive 001"], ["photos/IMG_5439.jpeg", "post-gym"], ["photos/IMG_5446.jpeg", "off duty"], ["photos/IMG_5444.jpeg", "hotel mornings"], ["photos/IMG_5466.jpeg", "goodnight"], ["photos/IMG_5473.jpeg", "corner store run"], ["photos/IMG_5517.jpeg", "fifth avenue, after dark"], ["photos/IMG_5751.jpeg", "helmet & carry-on"], ["photos/IMG_5762.jpeg", "caught in 4k"], ["photos/IMG_5761.jpeg", "tiny menace"]];const songs=[['Puma Blue','soft focus'],['The Marías','late night rotation'],['Frank Ocean','on repeat'],['Radiohead','headphones only'],['NIKI','the drive home'],['The 1975','studio playlist'],['Cigarettes After Sex','3:07 am'],['Arctic Monkeys','louder please'],['Joji','no skips'],['SZA','favorites']];function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}function render(html){document.getElementById('content').innerHTML=html;document.getElementById('appscreen').scrollTop=0}function openApp(n){show('appscreen');if(n==='Messages')render('<h1>Messages</h1>'+Object.keys(threads).map(k=>`<div class="listitem" onclick="thread('${k}')"><div class="avatar">${k[0]}</div><div><b>${k}</b><p>${threads[k].at(-1)[1]}</p></div><span class="right">now</span></div>`).join(''));else if(n==='Notes')render('<h1>Notes</h1><p class="muted">iCloud · 6 notes</p>'+notes.map((v,i)=>`<div class="note" onclick="note(${i})"><h3>${v[0]}</h3><p>${v[1].slice(0,72)}...</p></div>`).join(''));else if(n==='Photos')render('<h1>Recents</h1><p class="muted">10 memories · camera roll</p><div class="photogrid">'+photos.map((v,i)=>`<div class="photo" onclick="photo(${i})"><img src="${v[0]}" alt="${v[1]}" loading="lazy"></div>`).join('')+'</div>');else if(n==='Music')render('<h1>Music</h1><p class="muted">Ryo’s rotation · tap a track</p>'+songs.map((s,i)=>`<div class="song" onclick="song(${i})"><div class="cover">♫</div><div><b>${s[0]}</b><p>${s[1]}</p></div><span class="right">▶</span></div>`).join(''));else if(n==='Contacts')render('<h1>Contacts</h1>'+Object.keys(threads).concat(['Sol','Zuzu','AJ']).sort().map(k=>`<div class="listitem"><div class="avatar">${k[0]}</div><b>${k}</b></div>`).join(''));else if(n==='Calendar')render('<h1>Calendar</h1><div class="calday"><span class="eyebrow">SATURDAY · OCTOBER 31</span><br><strong>31</strong><h3>Till Death Do Us Party</h3><p>Deadlings only · #DeadAfterDark</p></div><div class="calday"><span class="eyebrow">REMINDER</span><h3>Don't book me on weekends.</h3></div>');else if(n==='Camera')render('<h1>Camera</h1><div class="fakecamera">✦</div><button class="shutter" onclick="toast(\'Camera is just a visual demo ✦\')" aria-label="Shutter"></button>');else render('<h1>Settings</h1><div class="note"><h3>RYO’S IPHONE</h3><p>Owner: Ryomen Yves Ozaki<br>Focus: Do Not Disturb<br>Current mood: making music instead of answering texts<br>Favorite dessert: vanilla ice cream<br>Wallpaper: 666 graffiti</p></div><button class="pill" onclick="show(\'lock\')">Lock iPhone</button>')}function thread(n){render(`<div class="threadhead"><div class="avatar">${n[0]}</div><b>${n}</b><p class="muted">fictional conversation</p></div>`+threads[n].map(([who,t])=>`<div class="bubble ${who==='me'?'me':''}">${t}</div>`).join(''))}function note(i){render(`<p class="muted">NOTES · RYO</p><h1>${notes[i][0]}</h1><div class="note" style="min-height:200px">${notes[i][1]}</div>`)}function photo(i){render(`<h1>${photos[i][1]}</h1><img src="${photos[i][0]}" alt="${photos[i][1]}" style="width:100%;max-height:580px;object-fit:contain;border-radius:12px;background:#000"><p class="muted">RYO · camera roll</p>`)}function song(i){toast(`${songs[i][0]} · playlist preview (no audio included)`)}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2500)}document.getElementById('apps').innerHTML=apps.map(([n,e,c])=>`<div class="app" onclick="openApp('${n}')"><div class="ico" style="background:${c}">${e}</div>${n}</div>`).join('');document.getElementById('dock').innerHTML=apps.slice(0,4).map(([n,e,c])=>`<div class="app" onclick="openApp('${n}')"><div class="ico" style="background:${c}">${e}</div></div>`).join('');let d=new Date();document.getElementById('date').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});function tick(){let t=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:false});document.getElementById('clock').textContent=t;document.getElementById('statusTime').textContent=t}tick();setInterval(tick,30000);
</script></body></html>
